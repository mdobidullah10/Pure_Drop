{% extends "base.html" %}

{% block title %}কাস্টমার লগইন — Pure Drop{% endblock %}

{% block content %}
<div class="container" style="padding: 50px 0 80px; max-width: 480px;">
  
  <div style="background: #fff; border: 1px solid var(--pd-border); border-radius: var(--pd-radius-lg); padding: 36px; box-shadow: var(--pd-shadow-md);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--pd-forest); margin-bottom: 6px;">কাস্টমার একাউন্টে প্রবেশ</h1>
      <p style="color: var(--pd-text-muted); font-size: 0.92rem;">আপনার অর্ডার হিস্ট্রি দেখতে লগইন করুন</p>
    </div>

    <form action="{{ url_for('customer_login') }}" method="POST">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">

      <div class="form-group">
        <label>মোবাইল নম্বর বা ইউজারনেম *</label>
        <input type="text" name="login_id" class="form-control" required placeholder="017XXXXXXXX বা ইউজারনেম">
      </div>

      <div class="form-group">
        <label>পাসওয়ার্ড *</label>
        <input type="password" name="password" class="form-control" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">লগইন করুন ➔</button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--pd-border); font-size: 0.9rem; color: var(--pd-text-muted);">
      নতুন গ্রাহক? <a href="{{ url_for('customer_register') }}" style="color: var(--pd-forest); font-weight: 700;">নতুন একাউন্ট খুলুন ➔</a>
    </div>
  </div>

</div>
{% endblock %}
