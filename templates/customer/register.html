{% extends "base.html" %}

{% block title %}নতুন কাস্টমার রেজিস্ট্রেশন — Pure Drop{% endblock %}

{% block content %}
<div class="container" style="padding: 50px 0 80px; max-width: 520px;">
  
  <div style="background: #fff; border: 1px solid var(--pd-border); border-radius: var(--pd-radius-lg); padding: 36px; box-shadow: var(--pd-shadow-md);">
    <div style="text-align: center; margin-bottom: 24px;">
      <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--pd-forest); margin-bottom: 6px;">নতুন একাউন্ট তৈরি করুন</h1>
      <p style="color: var(--pd-text-muted); font-size: 0.92rem;">দ্রুত অর্ডার ও ডেলিভারি ট্র্যাকিং সুবিধার জন্য যুক্ত হোন</p>
    </div>

    <form action="{{ url_for('customer_register') }}" method="POST">
      <div class="form-group">
        <label>আপনার সম্পূর্ণ নাম *</label>
        <input type="text" name="name" class="form-control" required placeholder="নাম লিখুন">
      </div>

      <div class="form-group">
        <label>মোবাইল নম্বর * (১১ ডিজিট)</label>
        <input type="tel" name="phone" class="form-control" required pattern="^01[3-9]\d{8}$" placeholder="017XXXXXXXX">
      </div>

      <div class="form-group">
        <label>ইমেইল অ্যাড্রেস (ঐচ্ছিক)</label>
        <input type="email" name="email" class="form-control" placeholder="example@email.com">
      </div>

      <div class="form-group">
        <label>পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)</label>
        <input type="password" name="password" class="form-control" required minlength="6" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">রেজিস্ট্রেশন সম্পন্ন করুন ➔</button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--pd-border); font-size: 0.9rem; color: var(--pd-text-muted);">
      ইতোমধ্যে একাউন্ট আছে? <a href="{{ url_for('customer_login') }}" style="color: var(--pd-forest); font-weight: 700;">এখানে লগইন করুন ➔</a>
    </div>
  </div>

</div>
{% endblock %}
