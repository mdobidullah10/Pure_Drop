{% extends "base.html" %}{% block title %}পণ্য ফর্ম | Pure Drop{% endblock %}{% block content %}<section class="wrap page-section narrow"><p class="eyebrow">PRODUCT EDITOR</p><h1>{{ 'পণ্য এডিট করুন' if product else 'নতুন পণ্য যোগ করুন' }}</h1><form class="form-card" method="post"><label>পণ্যের নাম *<input name="name" required value="{{ product['name'] if product else '' }}"></label><label>ক্যাটাগরি *<input name="category" required list="cats" value="{{ product['category'] if product else '' }}" placeholder="ঘি / মধু / সরিষার তেল"><datalist id="cats"><option value="ঘি"><option value="মধু"><option value="সরিষার তেল"><option value="অন্যান্য"></datalist></label><label>দাম (৳) *<input type="number" name="price" required min="0" step="0.01" value="{{ product['price'] if product else '' }}"></label><label>স্টক *<input type="number" name="stock" required min="0" step="1" value="{{ product['stock'] if product else 0 }}"></label><label>ছবির URL<input name="image_url" type="url" value="{{ product['image_url'] if product else '' }}" placeholder="https://..."></label><label>বিবরণ<textarea name="description" rows="4">{{ product['description'] if product else '' }}</textarea></label><label class="check-label"><input type="checkbox" name="active" {% if not product or product['active'] %}checked{% endif %}> ওয়েবসাইটে সক্রিয় রাখুন</label><button class="btn">সংরক্ষণ করুন</button><a class="text-link" href="{{ url_for('admin_products') }}">ফিরে যান</a></form></section>{% endblock %}
